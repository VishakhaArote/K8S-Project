apiVersion: v1
kind: Pod
metadata:
   name: hostpath-test
   namespace: tenant-a
spec:
   containers:
   - name: hostpath-container
     image: busybox
     command: ["sh", "-c", "sleep 3600"]
     volumeMounts:
      - name: host-volume
        mountPath: /host-data
   volumes:
   - name: host-volume
     hostPath:
        path: /
        type: Directory