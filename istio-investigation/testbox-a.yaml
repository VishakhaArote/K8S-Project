apiVersion: v1
kind: Pod
metadata:
  name: testbox-a
  namespace: tenant-a
  annotations:
    sidecar.istio.io/proxyCPU: "50m"
    sidecar.istio.io/proxyCPULimit: "100m"
    sidecar.istio.io/proxyMemory: "64Mi"
    sidecar.istio.io/proxyMemoryLimit: "128Mi"
spec:
  containers:
  - name: testbox
    image: busybox
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"