apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-b
  namespace: tenant-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-b
  template:
    metadata:
      labels:
        app: nginx-b
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts: 
        - name: tenant-b-data
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: tenant-b-data
        configMap:
          name: tenant-b-sensitive-data
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-b
  namespace: tenant-b
spec:
  selector:
    app: nginx-b
  ports:
  - port: 80
    targetPort: 80
   