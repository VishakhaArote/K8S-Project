apiVersion: apps/v1
kind: Deployment
metadata:
  name: testbox-a
  namespace: tenant-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testbox-a
  template:
    metadata:
      labels:
        app: testbox-a
    spec:
      containers:
      - name: testbox
        image: busybox
        command: ["sh", "-c", "sleep 3600"]